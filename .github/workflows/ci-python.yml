name: CI (Python)

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: python
        run: ruff check .
      - name: Type check
        working-directory: python
        run: mypy swarmmesh_cli
      - name: Test
        working-directory: python
        run: pytest --cov=swarmmesh_cli --cov-report=term-missing --cov-fail-under=80
      - name: Audit dependencies
        working-directory: python
        run: pip install pip-audit && pip-audit -r <(pip freeze) || true
