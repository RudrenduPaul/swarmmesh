[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmmesh-cli"
version = "0.1.3"
description = "Shared-context and memory coordination server + CLI for swarms of parallel AI agents, speaking the SwarmMesh v1 protocol (HTTP + WebSocket + MCP), interoperable with the Node implementation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rudrendu Paul" },
    { name = "Sourav Nandy" },
]
keywords = [
    "ai-agents",
    "multi-agent",
    "agent-coordination",
    "swarm",
    "shared-memory",
    "shared-context",
    "mcp",
    "model-context-protocol",
    "cli",
    "fastapi",
    "websocket",
    "bm25",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "websockets>=12.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/swarmmesh"
Repository = "https://github.com/RudrenduPaul/swarmmesh"
Issues = "https://github.com/RudrenduPaul/swarmmesh/issues"
"Author - Rudrendu Paul" = "https://github.com/RudrenduPaul"

[project.scripts]
swarmmesh = "swarmmesh_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["swarmmesh_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
